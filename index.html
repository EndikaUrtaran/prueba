            extendInitialExtraContents: true,
            initialExtraContents: [
                {
                    title: 'Contenido del Visor',
                    content: '<div><h2 style="text-align:center;color:#fff;background-color:#364b5f;padding:10px;border-radius:4px;">Contenido del visor</h2><div style="padding:12px;font-family:Arial,sans-serif;line-height:1.5;"><h3 style="color:#364b5f;border-bottom:2px solid #364b5f;padding-bottom:4px;">🎯 Finalidad del visor</h3><p>El visor cartográfico tiene como finalidad <strong>facilitar la identificación rápida de posibles afecciones a la planificación territorial derivadas de las competencias de distintos organismos de la Administración General del Estado (AGE) en el País Vasco</strong>, sirviendo como herramienta de apoyo para orientar sobre los posibles informes o consultas sectoriales que puedan resultar necesarios.</p><h3 style="color:#364b5f;border-bottom:2px solid #364b5f;padding-bottom:4px;">📋 Información recogida</h3><p>El visor reúne, para el <strong>ámbito del País Vasco</strong>, diferentes capas de información territorial relacionadas con las principales materias en las que pueden existir afecciones derivadas de competencias de la Administración General del Estado.</p><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>✈️ Aviación Civil</strong><ul><li>Envolvente de las servidumbres aeronáuticas</li><li>Servidumbres aeronáuticas para aerogeneradores</li><li>Municipios exentos de informe de Aviación Civil</li></ul><p>Permite identificar posibles afecciones derivadas de la normativa sobre <strong>servidumbres aeronáuticas</strong> y orientar sobre aquellos casos en los que pueda ser necesario consultar a la <strong>Dirección General de Aviación Civil</strong>.</p></div><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>🚆 Ferrocarriles</strong><ul><li>Red Ferroviaria de Interés General (RFIG) en servicio</li><li>Red Ferroviaria de Interés General (RFIG) fuera de servicio</li><li>Buffer de 100 m de ferrocarril existente en Euskadi</li><li>Buffer de 100m en torno a los estudios informativos de ferrocarril aprobados definitivamente en Euskadi</li><li>Buffer de 100m en torno a los estudios informativos de ferrocarril en tramitacion o aprobados como avance en Euskadi</li></ul><p>Facilitan la identificación de actuaciones situadas sobre o en las proximidades de líneas ferroviarias pertenecientes a la <strong>Red Ferroviaria de Interés General (RFIG) o de Estudios informativos aprobados y sin aprobar</strong>.</p></div><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>🛡️ Defensa</strong><ul><li>Zonas de Interés para la Defensa Nacional (ZIDN) en Euskadi</li><li>Zonas de Seguridad de Defensa en Euskadi</li></ul><p>Permiten detectar posibles afecciones a <strong>instalaciones, terrenos o zonas vinculadas al Ministerio de Defensa</strong>.</p></div><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>🌊 Costas</strong><ul><li>Dominio Público Marítimo-Terrestre (DPMT)</li></ul><p>Permite consultar el <strong>deslinde del Dominio Público Marítimo-Terrestre (DPMT)</strong> e identificar actuaciones afectadas por la legislación de costas.</p></div><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>💧 Hidrografía</strong><ul><li>Confederaciones Hidrográficas</li></ul><p>Permite identificar los <strong>ámbitos territoriales de gestión de los organismos de cuenca</strong> con competencias en el País Vasco.</p></div><div style="background:#f4f7fa;padding:10px;margin:8px 0;border-left:4px solid #364b5f;"><strong>🗺️ Límites administrativos</strong><ul><li>Límites administrativos</li></ul><p>Facilita la <strong>correcta localización y delimitación de las actuaciones objeto de consulta</strong>. Además, el visor permite la carga temporal de ficheros vectoriales propios para analizar ámbitos específicos.</p></div><h3 style="color:#b22222;border-bottom:2px solid #b22222;padding-bottom:4px;">⚠️ Carácter orientativo</h3><p>Las capas incorporadas al visor constituyen una <strong>herramienta de apoyo para la consulta y detección inicial de posibles afecciones sectoriales</strong>. La presencia o ausencia de una capa, o la intersección de una actuación con ella, <strong>no determina por sí misma la obligación de solicitar un informe</strong>.</p><p>Asimismo, pueden existir informes sectoriales cuya necesidad no dependa principalmente de la localización geográfica de la actuación, como determinados informes en materia de <strong>telecomunicaciones</strong>.</p><p>La necesidad de solicitar un informe deberá determinarse en cada caso de acuerdo con la <strong>legislación vigente</strong> y los criterios establecidos por el <strong>organismo sectorial competente</strong>.</p><p style="background:#fff3cd;border:1px solid #ffe69c;padding:10px;border-radius:4px;"><strong>Importante:</strong> Los resultados obtenidos mediante el visor deben considerarse orientativos y <strong>no sustituyen la consulta de la normativa aplicable ni, cuando proceda, la consulta al organismo competente</strong>.</p></div></div>',
                }
            ],
            finalExtraContents: [
                {
                    title: 'Aviso importante',
                    content: '<div><h2 style="text-align:center;color:#fff;background-color:#b22222;padding:8px 10px;">⚠️ Aviso importante</h2><div style="padding:12px;line-height:1.5;"><p>• El visor tiene carácter <strong>orientativo</strong> y no sustituye la consulta de la normativa aplicable ni las consultas al organismo competente.</p><p>• Algunas capas dependen de servicios OGC externos y pueden no estar disponibles temporalmente.</p><p>• Si detecta alguna incidencia, puede comunicarla a <a href="mailto:fomento.alava@correo.gob.es">fomento.alava@correo.gob.es</a>.</p></div></div>',
                }
            ]
        });
        map.addPlugin(mp);

        const mp2 = new IDEE.plugin.VectorsManagement({
            position: 'TR',

        map.addPlugin(mp2);
